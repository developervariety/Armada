# Opt-in non-root override for docker/armada/compose.yaml. Combine the two files:
#   docker compose -f compose.yaml -f compose.nonroot.yaml up -d --build
# Without this file the server runs as root. ARMADA_UID and ARMADA_GID choose the
# account (default 1654, the .NET base image's app user). The state directories
# next to compose.yaml must be owned by that UID and GID (docs/DOCKER.md,
# Non-root containers).
services:
  armada-server:
    build:
      target: runtime-nonroot
      args:
        ARMADA_UID: ${ARMADA_UID:-1654}
        ARMADA_GID: ${ARMADA_GID:-1654}
    user: "${ARMADA_UID:-1654}:${ARMADA_GID:-1654}"
