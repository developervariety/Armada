services:
  armada:
    ports:
      - "127.0.0.1:7892:7892"

  grok-gateway:
    image: caddy:2.10-alpine
    container_name: armada-grok-gateway
    restart: unless-stopped
    depends_on:
      - armada
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
