name: ci

# Every push/PR runs a warning-free Linux build, fast unit suites, targeted pipeline contract/routing regressions,
# and a check that committed dashboard dist/ matches its source. Other Services, E2E and TUI suites, other operating
# systems/net8.0, dashboard/mobile tests, parity, install and security checks run on demand through full.yml,
# install-verify.yml, db-parity.yml and security.yml. Nothing runs on a schedule.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Configure git for test repositories
        run: |
          git config --global user.name "Armada CI"
          git config --global user.email "ci@armada.invalid"
          git config --global init.defaultBranch main

      - name: Restore
        run: dotnet restore src/Armada.sln

      # Any compiler warning fails the build. NuGet audit advisories (NU190x) stay visible but do not: a newly
      # published advisory is not a defect in the change under test (security.yml checks dependencies on demand).
      - name: Build (warnings as errors)
        run: dotnet build src/Armada.sln -c Release --no-restore -warnaserror -warnnotaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Smoke tests
        run: dotnet run --project src/Test.Automated -c Release --no-build --framework net10.0 -- --suites Models,Client,Metrics,Database,Runtimes

      - name: Pipeline and lifecycle regressions
        run: dotnet run --project src/Test.Automated -c Release --no-build --framework net10.0 -- --suites Services.GitService,Services.ArchitectPlanParser,Services.PromptTemplateService,Services.PromptSignalConsistency,Services.RecorderSeeding,Services.MissionPrompt,Services.MultiRuntimeFlow,Services.CaptainRouting,Services.AgentLifecycleHandler,Services.PipelineDispatch,Services.AdmiralService,Services.StallRecovery

  dashboard-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Armada.Dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Armada.Dashboard/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # dist/ is committed (deploy scripts fall back to it), so dashboard source changed without a rebuilt dist/
      # would ship a stale dashboard.
      - name: Committed dist/ matches the source
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [ -n "$changes" ]; then
            echo "::error::src/Armada.Dashboard/dist is out of date. Run 'npm ci && npm run build' in src/Armada.Dashboard and commit dist/."
            echo "$changes"
            exit 1
          fi
